[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelbot"
version = "0.1.0"
description = "Telegram-бот, который с помощью Claude опрашивает отели по почте и сравнивает предложения"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
]

[project.optional-dependencies]
auth = ["google-auth-oauthlib>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotelbot = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
